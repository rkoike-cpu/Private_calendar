<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Calendar</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Personal Calendar</h1>
    <div class="header-actions">
      <button id="add-event-btn">+ 予定を追加</button>
      <button id="sync-google">同期</button>
    </div>
  </header>

  <p id="status"></p>

  <dialog id="add-event-dialog">
    <form id="add-event-form">
      <h2 id="add-event-title">予定を追加</h2>
      <label>
        タイトル
        <input type="text" name="summary" required />
      </label>
      <label>
        日付
        <input type="date" name="date" required />
      </label>
      <label>
        開始時刻
        <input type="time" name="start" required />
      </label>
      <label>
        終了時刻
        <input type="time" name="end" required />
      </label>
      <menu>
        <button type="button" id="delete-event-btn" hidden>削除</button>
        <span class="menu-spacer"></span>
        <button type="button" id="cancel-add-event">キャンセル</button>
        <button type="submit" id="submit-event-btn">追加</button>
      </menu>
    </form>
  </dialog>

  <section id="weather">
    <h2>今日の天気</h2>
    <div id="weather-strip" class="weather-strip"></div>
  </section>

  <div class="view-toggle" id="view-toggle">
    <button data-view="day">日</button>
    <button data-view="week">週</button>
    <button data-view="month">月</button>
  </div>

  <div class="week-nav">
    <button id="prev-nav">&lt;</button>
    <span id="nav-label"></span>
    <button id="next-nav">&gt;</button>
  </div>

  <div class="cal-wrapper">
    <div id="calendar">
      <div class="cal-header" id="cal-header"></div>
      <div class="cal-body">
        <div class="cal-time-col" id="cal-time-col"></div>
        <div class="cal-days" id="cal-days"></div>
      </div>
    </div>

    <div id="calendar-month" hidden></div>
  </div>

  <div id="event-popover" class="event-popover" hidden>
    <div class="popover-title"></div>
    <div class="popover-time"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
